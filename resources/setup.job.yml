resources:
  jobs:
    setup:
      name: Research landscape | setup
      max_concurrent_runs: 1
      parameters:
      - name: catalog
        default: ${var.catalog}
      - name: profile
        default: ${bundle.target}
      - name: project_root
        default: ${workspace.file_path}
      - name: secret_scope
        default: ${var.secret_scope}
      - name: secret_key
        default: ${var.secret_key}
      - name: extraction_id
        default: ''
      - name: ingestion_mode
        default: full
      - name: updated_since
        default: ''
      tasks:
      - task_key: initialize_environment
        notebook_task:
          notebook_path: ../notebooks/00_setup/00_initialize_environment.py
          source: WORKSPACE
          base_parameters:
            run_id: '{{job.run_id}}'
        timeout_seconds: 1800
        max_retries: 0
        environment_key: research
      - task_key: validate_configuration
        notebook_task:
          notebook_path: ../notebooks/00_setup/01_validate_configuration.py
          source: WORKSPACE
          base_parameters:
            run_id: '{{job.run_id}}'
        timeout_seconds: 1800
        max_retries: 0
        depends_on:
        - task_key: initialize_environment
        environment_key: research
      environments:
      - environment_key: research
        spec:
          environment_version: '4'
          dependencies:
          - PyYAML>=6,<7
